name: GHCR doctor
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          echo 'github.repository='$GITHUB_REPOSITORY
          echo 'github.actor='$GITHUB_ACTOR
          docker buildx imagetools inspect ghcr.io/ardeyouxipianyi/workbuddy2api-hub:v1.10.9 || true
          docker pull python:3.11-alpine
          docker tag python:3.11-alpine ghcr.io/xacppp/workbuddy2api-hub:doctor-$GITHUB_RUN_ID
          docker push ghcr.io/xacppp/workbuddy2api-hub:doctor-$GITHUB_RUN_ID
