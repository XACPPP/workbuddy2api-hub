name: Publish Docker image

# Fork-only workflow. Business source and Dockerfile come from an upstream
# stable Release, while this fork owns the publishing rules.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable upstream tag, for example v1.10.9"
        required: true
        type: string
      rebuild:
        description: "Rebuild even when this version already exists"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [upstream_release]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: workbuddy-ghcr-publish
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: ardeyouxipianyi
  UPSTREAM_REPO: workbuddy2api-hub
  IMAGE: ghcr.io/xacppp/workbuddy2api-hub-fork
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SOURCE_TAG: ${{ inputs.tag || '' }}
  DISPATCH_TAG: ${{ github.event.client_payload.tag || '' }}
  REBUILD: ${{ inputs.rebuild || false }}

jobs:
  publish:
    name: Publish verified stable image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this fork's maintenance files
        id: fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable hourly schedule when explicitly disabled
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh api "repos/${{ github.repository }}/actions/workflows/docker-publish.yml" --jq .state)
          if [[ "$STATE" != "active" ]]; then
            gh workflow enable docker-publish.yml
            echo "Re-enabled the hourly schedule."
          fi

      - name: Resolve stable upstream Release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          done_unchanged() {
            {
              echo "### Already published"
              echo
              echo "\`$TAG\` already has both architectures; build and latest are untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
            exit 0
          }

          no_release() {
            echo "::warning::No eligible stable upstream Release; existing images stay unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "release_url=" >> "$GITHUB_OUTPUT"
            exit 0
          }

          is_stable_tag() {
            [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          }

          if [[ "${{ github.event_name }}" == "release" ]]; then
            SOURCE_REPOSITORY="${{ github.repository }}"
          else
            SOURCE_REPOSITORY="$UPSTREAM_OWNER/$UPSTREAM_REPO"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || \
                "${{ github.event_name }}" == "repository_dispatch" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              TAG="$SOURCE_TAG"
            else
              TAG="$DISPATCH_TAG"
            fi
            if ! is_stable_tag "$TAG"; then
              echo "::error::Requested tag must be exact semver like v1.10.9."
              exit 1
            fi
            RELEASE_URL=$(gh release view "$TAG" --repo "$SOURCE_REPOSITORY" --json url --jq '.url')
            DRAFT=$(gh release view "$TAG" --repo "$SOURCE_REPOSITORY" --json isDraft --jq '.isDraft')
            PRE=$(gh release view "$TAG" --repo "$SOURCE_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
            PUBLISHED=$(gh release view "$TAG" --repo "$SOURCE_REPOSITORY" --json publishedAt --jq '.publishedAt')
            [[ "$DRAFT" == "false" && "$PRE" == "false" ]] || {
              echo "::error::$TAG is not a published stable Release."; exit 1;
            }
            [[ -n "$PUBLISHED" && "$PUBLISHED" != "null" ]] || {
              echo "::error::$TAG has no publication timestamp."; exit 1;
            }
          else
            # A lone Git tag, draft, or prerelease is not a stable Release.
            TAG=$(gh api --paginate \
              "repos/$SOURCE_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and .published_at != null) | select(.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))][0].tag_name')
            if [[ -z "$TAG" ]]; then
              no_release
            fi
            RELEASE_URL=$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG" --jq '.html_url')
          fi

          TAG_OBJECT=$(gh api "repos/$SOURCE_REPOSITORY/git/ref/tags/$TAG")
          TAG_TYPE=$(printf '%s' "$TAG_OBJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])')
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_URL=$(printf '%s' "$TAG_OBJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["url"])')
            COMMIT=$(gh api "$TAG_URL" --jq '.object.sha')
          else
            COMMIT=$(printf '%s' "$TAG_OBJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve $TAG to a commit."; exit 1;
          }
          echo "Resolved $TAG -> $COMMIT"

          EXISTING="false"
          if [[ "$REBUILD" != "true" ]]; then
            printf '%s' "$GH_TOKEN" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            if docker buildx imagetools inspect "$IMAGE:$TAG" --raw > existing.json 2>/dev/null; then
              PLATFORMS=$(python3 maintenance/checks/manifest-platforms.py existing.json)
              if [[ ",$PLATFORMS," == *",linux/amd64,"* && \
                    ",$PLATFORMS," == *",linux/arm64,"* ]]; then
                EXISTING="true"
              else
                echo "::error::$TAG exists without both required architectures."
                exit 1
              fi
            fi
            docker logout ghcr.io
          fi

          if [[ "${{ github.event_name }}" == "release" && \
                "$SOURCE_REPOSITORY" != "$UPSTREAM_OWNER/$UPSTREAM_REPO" ]]; then
            echo "::notice::Release is not on the upstream repository; no image."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "release_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EXISTING" == "true" ]]; then
            done_unchanged
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Stop when this version is already published
        if: steps.resolve.outputs.publish != 'true'
        shell: bash
        run: |
          echo "No build needed for resolve result: ${{ steps.resolve.outputs.publish }}"

      - name: Check out upstream source at the stable tag
        if: steps.resolve.outputs.publish == 'true'
        id: source
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
          FORK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MAINTENANCE_FILES=$(git ls-tree -r --name-only "$FORK_SHA" -- maintenance)
          WORKFLOW_FILES=$(git ls-tree -r --name-only "$FORK_SHA" -- .github/workflows)
          git fetch --no-tags --depth=1 \
            "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git" \
            "refs/tags/$TAG:refs/upstream/$TAG"
          COMMIT=$(git rev-parse "refs/upstream/$TAG^{}")
          if [[ "$COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Tag moved during resolution ($EXPECTED_COMMIT -> $COMMIT)."
            exit 1
          fi
          git checkout --detach "$COMMIT"
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git show "$FORK_SHA:$path" > "$path"
          done <<< "$MAINTENANCE_FILES"
          rm -rf .github/workflows
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git show "$FORK_SHA:$path" > "$path"
          done <<< "$WORKFLOW_FILES"
          git show "$FORK_SHA:.github/workflow-policy.json" > .github/workflow-policy.json
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify no unrecorded business-source changes
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(maintenance/patches/*.patch)
          if [[ "${#patches[@]}" -eq 0 ]]; then
            git diff --exit-code "$COMMIT" -- 'wb_*.py' dashboard.html Dockerfile
            echo "Business source and Dockerfile match upstream byte-for-byte."
          fi

      - name: Apply maintained patches
        if: >-
          ${{ steps.resolve.outputs.publish == 'true' &&
              hashFiles('maintenance/patches/*.patch') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in maintenance/patches/*.patch; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Validate workflow contract
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 maintenance/checks/workflow-contract.test.py

      - uses: docker/setup-qemu-action@v3
        if: steps.resolve.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.resolve.outputs.publish == 'true'

      - name: Log in to GHCR
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.resolve.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.commit }}
            io.github.xacppp.release-url=${{ steps.resolve.outputs.release_url }}

      # latest is deliberately not in this list. The version tag becomes
      # visible only when both platform builds complete.
      - name: Build and push version tag
        if: steps.resolve.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=workbuddy2api-hub
          cache-to: type=gha,mode=max,scope=workbuddy2api-hub
          provenance: mode=max
          sbom: true

      - name: Verify both architectures in the pushed version
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw > manifest.json
          PLATFORMS=$(python3 maintenance/checks/manifest-platforms.py manifest.json)
          [[ ",$PLATFORMS," == *",linux/amd64,"* && \
             ",$PLATFORMS," == *",linux/arm64,"* ]] || {
            echo "::error::$TAG lacks linux/amd64 or linux/arm64: $PLATFORMS"; exit 1;
          }
          echo "$TAG verified: $PLATFORMS"
          docker buildx imagetools inspect "$IMAGE:$TAG"

      - name: Promote verified version to latest
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          RELEASE_URL: ${{ steps.resolve.outputs.release_url }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:latest" "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:latest" --raw > latest.json
          PLATFORMS=$(python3 maintenance/checks/manifest-platforms.py latest.json)
          [[ ",$PLATFORMS," == *",linux/amd64,"* && \
             ",$PLATFORMS," == *",linux/arm64,"* ]] || {
            echo "::error::latest lacks linux/amd64 or linux/arm64: $PLATFORMS"; exit 1;
          }
          echo "latest verified: $PLATFORMS"
          echo "latest_published=$TAG"
          echo "release=$TAG"
          echo "commit=$COMMIT"
          echo "digest=$DIGEST"
          {
            echo "### Published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream | [$TAG]($RELEASE_URL) |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
