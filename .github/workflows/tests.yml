name: maintain-fork

# The fork does not carry upstream's release-packaging pipeline. These checks
# protect the only maintained surface: stable Release discovery and GHCR
# publishing. Business source parity is checked in docker-publish.yml right
# after the selected upstream tag is checked out.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: maintain-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate maintained workflow set and release invariants
        run: python maintenance/checks/workflow-contract.test.py
      - name: Validate automatic workflow cleanup
        run: python maintenance/checks/workflow-cleanup.test.py
      - name: Validate old workflow run cleanup
        run: python maintenance/checks/workflow-runs-cleanup.test.py
      - name: Validate release-engineering integration
        run: python tests/_test_release_engineering.py
