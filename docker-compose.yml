# WorkBuddy2API-Hub Docker Compose
# 部署：docker compose up -d
# 更新：docker compose pull && docker compose up -d
services:
  wb-proxy:
    # `latest` follows only a verified, published upstream stable Release.
    # Pin an exact tag such as v1.10.9 when a controlled rollback is required.
    image: ghcr.io/xacppp/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage

  watchtower:
    image: containrrr/watchtower:latest
    container_name: wb-proxy-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
    command: --interval 3600 --cleanup wb-proxy
